<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: grid;
            /* gap: 10px;
            height: 400px;
            grid-template-areas:
                "box1 box2 box2"
                "box1 box3 box4"
                "box1 box3 box5"; */

            grid-template:
                "box1 box1 box1" 100px
                "box2 box2 box4" 200px
                "box2 box2 box4" 190px
                "box3 box3 box4" 140px/200px 280px 70px;

            column-gap: 20px;
            row-gap: 20px;
            /* justify-items: center;
            align-items: center; */
        }

        .box {
            border: 2px solid purple;
            background-color: lavender;
        }

        .b1 {
            grid-area: box1;
        }

        .b2 {
            grid-area: box2;
        }

        .b3 {
            grid-area: box3;
        }

        .b4 {
            grid-area: box4;
        }

        /* .b5 {
            grid-area: box5;
        } */
    </style>
</head>

<body>

    <div class="container">
        <div class="box b1">1</div>
        <div class="box b2">2</div>
        <div class="box b3">3</div>
        <div class="box b4">4</div>
        <!-- <div class="box b5">5</div> -->
    </div>

</body>

</html>
