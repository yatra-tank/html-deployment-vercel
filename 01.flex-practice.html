<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Demo</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around; 
            align-items: center;
            align-content: center;
            
            background-color: darkblue;
            border-radius: 8px;
            width: 100%;
            height: 400px;
            padding: 10px;
            box-sizing: border-box;
        }

        .item {
            background: white;
            color: black;
            text-align: center;
            width: 120px;
            height: 80px;
            margin: 5px;
            border-radius: 4px;
        }

        .one{
            order: 3;
            flex-shrink: 4;
        }
        .two{
            order: 6;
            flex-grow: 1;
            align-self: center;
        }
        .three{
            order: 5;
            flex-shrink: 2;
        }
        .four{
            order: 2;
            flex-basis: 500px;
        }
        .five{
            order: 1;
            flex-shrink: 6;
            align-self: flex-start;
        }
        .six{
            order: 4;
            flex-basis: 300px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item one">1</div>
        <div class="item two">2</div>
        <div class="item three">3</div>
        <div class="item four">4</div>
        <div class="item five">5</div>
        <div class="item six">6</div>
    </div>

</body>
</html>
