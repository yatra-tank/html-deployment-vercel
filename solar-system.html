<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
        }

        .space {
            width: 500px;
            height: 500px;
            position: relative;
            margin: auto;
            top: 100px;
        }

        .sun {
            background-color: orange;
            height: 70px;
            width: 70px;
            border-radius: 50%;
            position: absolute;
            top: 215px;
            left: 215px;
            box-shadow: 0px 0px 25px orange;
        }

        .orbit {
            position: absolute;
            border: 1px solid grey;
            border-radius: 50%;
            animation-name: rotate;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            top: 50%;
            left: 50%;
        }

        .orbit1 {
            width: 150px;
            height: 150px;
            top: 175px;
            left: 175px;
            animation-duration: 4s;
        }

        .orbit2 {
            width: 280px;
            height: 280px;
            top: 110px;
            left: 110px;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .orbit3 {
            width: 420px;
            height: 420px;
            top: 40px;
            left: 40px;
            animation-duration: 10s;
        }

        .planet {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            position: absolute;
            top: 0px;
            left: 50%;
        }

        .earth {
            background-color: skyblue;
        }

        .mars {
            background-color: red;
        }

        .blue {
            background-color: blue;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="space">
        <div class="sun"></div>

        <div class="orbit orbit1">
            <div class="planet earth"></div>
        </div>

        <div class="orbit orbit2">
            <div class="planet mars"></div>
        </div>

        <div class="orbit orbit3">
            <div class="planet blue"></div>
        </div>
    </div>

</body>

</html>
