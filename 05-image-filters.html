<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .filter {
            filter: blur(90px);
            filter: brightness(150%);
            filter: contrast(50%);
            filter: (5px 5px 10px black);
            filter: grayscale(100%);
            filter: hue-rotate(70deg);
            filter: invert(140%);
            filter: opacity(60%);
            filter: saturate(200%);
            filter: sepia(60%);
        } 
    </style>
</head>
